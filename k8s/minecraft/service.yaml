# MetalLB выдаст адрес из 192.168.2.240-250: по нему играют дома,
# и на него же указывает туннель playit.gg для друзей снаружи.
apiVersion: v1
kind: Service
metadata:
  name: minecraft
spec:
  type: LoadBalancer
  selector:
    app: minecraft
  ports:
    - name: minecraft
      port: 25565
      targetPort: 25565
      protocol: TCP
    # Bedrock через Geyser (k8s/minecraft/geyser-config.yaml)
    - name: bedrock-raknet
      port: 19132
      targetPort: 19132
      protocol: UDP
    - name: bedrock-signal
      port: 19132
      targetPort: 19132
      protocol: TCP
    - name: bedrock-webrtc
      port: 19133
      targetPort: 19133
      protocol: UDP
---
# RCON — только внутри кластера, для java-bridge
apiVersion: v1
kind: Service
metadata:
  name: minecraft-rcon
spec:
  selector:
    app: minecraft
  ports:
    - name: rcon
      port: 25575
      targetPort: 25575
      protocol: TCP
