# Снаружи — через Cloudflare Tunnel (как chatbot.antfarm.dev в cosmo-fleet).
# DNS создаёт external-dns по этому маршруту; ещё нужно правило в
# configmap cloudflared для promptcraft.antfarm.dev.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bridge
  annotations:
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
spec:
  parentRefs:
    - name: antfarm-public-gateway
      namespace: istio-ingress
  hostnames:
    - promptcraft.antfarm.dev
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      timeouts:
        request: 0s
      backendRefs:
        - name: bridge
          port: 8765
