apiVersion: apps/v1
kind: Deployment
metadata:
  name: bridge
  labels:
    app: bridge
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: bridge
  template:
    metadata:
      labels:
        app: bridge
    spec:
      # иначе Kubernetes добавит BRIDGE_PORT=tcp://... от сервиса bridge
      enableServiceLinks: false
      # java-bridge читает лог пода minecraft (k8s/bridge/rbac.yaml)
      serviceAccountName: bridge
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: bridge
          image: ghcr.io/lasdolphin/promptcraft-bridge:latest
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: bridge
          env:
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: minecraft-litellm
                  key: LITELLM_API_KEY
            - name: BRIDGE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: promptcraft-bridge-token
                  key: password
          ports:
            - containerPort: 8765
              name: ws
          readinessProbe:
            tcpSocket:
              port: 8765
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: scripts
              mountPath: /data/scripts
        # Тот же образ: команды из чата сервера Java (k8s/minecraft) — по RCON.
        # Скрипты на общем диске, поэтому run <имя> работает в обеих играх.
        - name: java-bridge
          image: ghcr.io/lasdolphin/promptcraft-bridge:latest
          imagePullPolicy: Always
          command: ["python", "-m", "mcai.java_bridge"]
          envFrom:
            - configMapRef:
                name: bridge
          env:
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: minecraft-litellm
                  key: LITELLM_API_KEY
            - name: RCON_HOST
              value: minecraft-rcon
            # откуда ИИ смотрит на мир в задачах (сайдкар world-reader в поде minecraft)
            - name: WORLD_URL
              value: http://minecraft-world:8090
            # админы сервера (могут одобрять игроков командой allow в чате)
            - name: ADMINS
              value: .MattOmelett,.TrivialWig39433
            # пароль админки https://promptcraft-admin.antfarm.dev
            - name: ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: promptcraft-bridge-token
                  key: password
            - name: RCON_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: promptcraft-bridge-token
                  key: password
          ports:
            - containerPort: 8080
              name: admin
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: scripts
              mountPath: /data/scripts
      volumes:
        - name: scripts
          persistentVolumeClaim:
            claimName: bridge-scripts
