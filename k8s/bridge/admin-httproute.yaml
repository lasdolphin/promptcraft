# Админка сервера Java: https://promptcraft-admin.antfarm.dev — через локальный gateway,
# открывается только из домашней сети. DNS-запись на адрес gateway создаёт external-dns.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bridge-admin
spec:
  parentRefs:
    - name: antfarm-gateway
      namespace: istio-ingress
      sectionName: https-antfarm
  hostnames:
    - promptcraft-admin.antfarm.dev
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: bridge-admin
          port: 8080
