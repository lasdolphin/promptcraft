apiVersion: apps/v1
kind: Deployment
metadata:
  name: bedrock
  labels:
    app: bedrock
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: bedrock
  template:
    metadata:
      labels:
        app: bedrock
    spec:
      enableServiceLinks: false
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
        - name: bedrock
          image: itzg/minecraft-bedrock-server:2026.9.0
          # консоль сервера: kubectl -n promptcraft exec deploy/bedrock -- send-command <команда>
          stdin: true
          tty: true
          env:
            - name: EULA
              value: "TRUE"
            - name: VERSION
              value: LATEST
            - name: SERVER_NAME
              value: Promptcraft
            - name: LEVEL_NAME
              value: promptcraft
            - name: GAMEMODE
              value: creative
            - name: DIFFICULTY
              value: peaceful
            - name: ALLOW_CHEATS
              value: "true"
            - name: ONLINE_MODE
              value: "true"
            - name: MAX_PLAYERS
              value: "10"
            - name: ALLOW_LIST
              value: "true"
            # гейммтеги через запятую; друзей добавлять сюда
            - name: ALLOW_LIST_USERS
              value: Mattomelette
            - name: OPS
              value: Mattomelette
            - name: DEFAULT_PLAYER_PERMISSION_LEVEL
              value: member
          # Bedrock 1.26 принимает клиентов по TCP 19132 (раньше был UDP/RakNet);
          # UDP оставлен для старых клиентов и LAN
          ports:
            - containerPort: 19132
              protocol: TCP
              name: bedrock-tcp
            - containerPort: 19132
              protocol: UDP
              name: bedrock-udp
          readinessProbe:
            tcpSocket:
              port: 19132
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              memory: 4Gi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: bedrock-data
