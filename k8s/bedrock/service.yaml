# MetalLB выдаст адрес из 192.168.2.240-250: по нему играют дома,
# и на него же указывает туннель playit.gg для друзей снаружи.
apiVersion: v1
kind: Service
metadata:
  name: bedrock
spec:
  type: LoadBalancer
  selector:
    app: bedrock
  ports:
    - name: bedrock
      port: 19132
      targetPort: 19132
      protocol: TCP
